<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d09c"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00d09c" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  
  <!-- Trading Growth Chart Wave -->
  <g filter="url(#glow)">
    <polyline points="420 160 270 310 180 220 70 330" fill="none" stroke="url(#lineGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="310 160 420 160 420 270" fill="none" stroke="url(#lineGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
