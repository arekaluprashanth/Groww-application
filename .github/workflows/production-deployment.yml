name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  production-check:
    name: Production Status & Deployment Verification
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://groww-application.vercel.app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Production Assets
        run: |
          echo "Verifying Groww Application production assets..."
          if [ -f "index.html" ]; then
            echo "✅ index.html exists and is production-ready."
          else
            echo "❌ index.html missing!"
            exit 1
          fi
          echo "✅ Production verification passed successfully."
